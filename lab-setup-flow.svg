<svg width="100%" viewBox="0 0 680 220" font-family="Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">Lab Setup Flow</text>

  <!-- Step 1 -->
  <rect x="20" y="60" width="100" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="70" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Step 1</text>
  <text x="70" y="97" text-anchor="middle" font-size="10" fill="#1d4ed8">Azure VM</text>
  <text x="70" y="110" text-anchor="middle" font-size="10" fill="#1d4ed8">Setup</text>

  <line x1="120" y1="88" x2="140" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="140" y="60" width="100" height="56" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="190" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#065f46">Step 2</text>
  <text x="190" y="97" text-anchor="middle" font-size="10" fill="#059669">Install</text>
  <text x="190" y="110" text-anchor="middle" font-size="10" fill="#059669">AD DS + GPMC</text>

  <line x1="240" y1="88" x2="260" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="260" y="60" width="100" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="310" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">Step 3</text>
  <text x="310" y="97" text-anchor="middle" font-size="10" fill="#d97706">Promote to</text>
  <text x="310" y="110" text-anchor="middle" font-size="10" fill="#d97706">Domain Controller</text>

  <line x1="360" y1="88" x2="380" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Step 4 -->
  <rect x="380" y="60" width="100" height="56" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="0.5"/>
  <text x="430" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#9d174d">Step 4</text>
  <text x="430" y="97" text-anchor="middle" font-size="10" fill="#db2777">OUs, Groups</text>
  <text x="430" y="110" text-anchor="middle" font-size="10" fill="#db2777">&amp; Users</text>

  <line x1="480" y1="88" x2="500" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Step 5 -->
  <rect x="500" y="60" width="100" height="56" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="550" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Step 5</text>
  <text x="550" y="97" text-anchor="middle" font-size="10" fill="#7c3aed">Configure</text>
  <text x="550" y="110" text-anchor="middle" font-size="10" fill="#7c3aed">Group Policy</text>

  <!-- Arrow down from Step 5 to Step 6 -->
  <line x1="550" y1="116" x2="550" y2="150" stroke="#6b7280" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Step 6 -->
  <rect x="500" y="150" width="100" height="48" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="550" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Step 6</text>
  <text x="550" y="188" text-anchor="middle" font-size="10" fill="#dc2626">Help Desk Tasks</text>

  <!-- Return arrow from Step 6 back left (bottom) -->
  <line x1="500" y1="174" x2="70" y2="174" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="70" y1="174" x2="70" y2="116" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#9ca3af">Iterate &amp; Practice</text>
</svg>