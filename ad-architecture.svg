<svg width="100%" viewBox="0 0 680 620" font-family="Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Azure Cloud Container -->
  <rect x="10" y="10" width="660" height="600" rx="20" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="30" y="34" font-size="13" font-weight="500" fill="#3b82f6">☁ Azure Free Tier</text>

  <!-- Windows Server VM Container -->
  <rect x="30" y="48" width="620" height="540" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="50" y="72" font-size="12" font-weight="500" fill="#1d4ed8">🖥 Windows Server 2025 VM (lab.local)</text>

  <!-- Domain Controller Box -->
  <rect x="220" y="84" width="240" height="64" rx="10" fill="#1d4ed8" stroke="#1e40af" stroke-width="0.5"/>
  <text x="340" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="white">Domain Controller</text>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#bfdbfe">lab.local · DNS · Authentication</text>

  <!-- Arrow from DC down -->
  <line x1="340" y1="148" x2="340" y2="172" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="#6b7280">Forest: lab.local</text>

  <!-- OU Row Label -->
  <text x="340" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#374151">Organizational Units (OUs)</text>

  <!-- IT OU -->
  <rect x="48" y="212" width="100" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="98" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#1e40af">IT</text>
  <text x="98" y="248" text-anchor="middle" font-size="10" fill="#3b82f6">alice.chen</text>

  <!-- Finance OU -->
  <rect x="162" y="212" width="100" height="44" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="212" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#065f46">Finance</text>
  <text x="212" y="248" text-anchor="middle" font-size="10" fill="#059669">bob.patel</text>

  <!-- HR OU -->
  <rect x="276" y="212" width="100" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="326" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#92400e">HR</text>
  <text x="326" y="248" text-anchor="middle" font-size="10" fill="#d97706">carol.jones</text>

  <!-- Sales OU -->
  <rect x="390" y="212" width="100" height="44" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="0.5"/>
  <text x="440" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#9d174d">Sales</text>
  <text x="440" y="248" text-anchor="middle" font-size="10" fill="#db2777">david.smith</text>

  <!-- Computers OU -->
  <rect x="504" y="212" width="110" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="559" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#5b21b6">Computers</text>
  <text x="559" y="248" text-anchor="middle" font-size="10" fill="#7c3aed">Workstations</text>

  <!-- Lines from DC to OUs -->
  <line x1="340" y1="148" x2="98" y2="212" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="340" y1="148" x2="212" y2="212" stroke="#6ee7b7" stroke-width="0.8"/>
  <line x1="340" y1="148" x2="326" y2="212" stroke="#fcd34d" stroke-width="0.8"/>
  <line x1="340" y1="148" x2="440" y2="212" stroke="#f9a8d4" stroke-width="0.8"/>
  <line x1="340" y1="148" x2="559" y2="212" stroke="#c4b5fd" stroke-width="0.8"/>

  <!-- Security Groups Label -->
  <text x="340" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#374151">Security Groups</text>

  <!-- IT_Admins -->
  <rect x="48" y="296" width="100" height="36" rx="6" fill="#1e40af" stroke="#1d4ed8" stroke-width="0.5"/>
  <text x="98" y="318" text-anchor="middle" font-size="11" fill="white">IT_Admins</text>

  <!-- Finance_Users -->
  <rect x="162" y="296" width="100" height="36" rx="6" fill="#065f46" stroke="#059669" stroke-width="0.5"/>
  <text x="212" y="318" text-anchor="middle" font-size="11" fill="white">Finance_Users</text>

  <!-- HR_Users -->
  <rect x="276" y="296" width="100" height="36" rx="6" fill="#92400e" stroke="#d97706" stroke-width="0.5"/>
  <text x="326" y="318" text-anchor="middle" font-size="11" fill="white">HR_Users</text>

  <!-- Sales_Users -->
  <rect x="390" y="296" width="100" height="36" rx="6" fill="#9d174d" stroke="#db2777" stroke-width="0.5"/>
  <text x="440" y="318" text-anchor="middle" font-size="11" fill="white">Sales_Users</text>

  <!-- Lines from OUs to Groups -->
  <line x1="98" y1="256" x2="98" y2="296" stroke="#93c5fd" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="212" y1="256" x2="212" y2="296" stroke="#6ee7b7" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="326" y1="256" x2="326" y2="296" stroke="#fcd34d" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="256" x2="440" y2="296" stroke="#f9a8d4" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- GPO Section -->
  <rect x="48" y="360" width="580" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="338" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">Group Policy Objects (GPOs)</text>

  <rect x="68" y="390" width="160" height="48" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
  <text x="148" y="410" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">IT Security Policy</text>
  <text x="148" y="428" text-anchor="middle" font-size="10" fill="#15803d">Linked to IT OU</text>

  <rect x="248" y="390" width="160" height="48" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
  <text x="328" y="410" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Password Policy</text>
  <text x="328" y="428" text-anchor="middle" font-size="10" fill="#15803d">Min 12 chars · Complexity</text>

  <rect x="428" y="390" width="180" height="48" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
  <text x="518" y="410" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Screen Lock + USB Block</text>
  <text x="518" y="428" text-anchor="middle" font-size="10" fill="#15803d">15 min · Deny removable</text>

  <!-- Arrow from IT OU to GPO -->
  <line x1="98" y1="332" x2="148" y2="390" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Help Desk Tasks -->
  <rect x="48" y="470" width="580" height="90" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="338" y="492" text-anchor="middle" font-size="12" font-weight="500" fill="#6b21a8">Help Desk Operations</text>

  <rect x="68" y="500" width="120" height="44" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="128" y="518" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Reset Password</text>
  <text x="128" y="534" text-anchor="middle" font-size="10" fill="#7c3aed">Set-ADAccountPassword</text>

  <rect x="208" y="500" width="120" height="44" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="268" y="518" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Unlock Account</text>
  <text x="268" y="534" text-anchor="middle" font-size="10" fill="#7c3aed">Unlock-ADAccount</text>

  <rect x="348" y="500" width="120" height="44" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="408" y="518" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Disable Account</text>
  <text x="408" y="534" text-anchor="middle" font-size="10" fill="#7c3aed">Disable-ADAccount</text>

  <rect x="488" y="500" width="120" height="44" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="548" y="518" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Audit / Report</text>
  <text x="548" y="534" text-anchor="middle" font-size="10" fill="#7c3aed">Get-ADUser -Filter</text>
</svg>